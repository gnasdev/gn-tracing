version: "3"

# Load root .env for deploy/build tasks so CHROME_EXTENSION_ID, Cloudflare
# tokens, and GOOGLE_* credentials reach scripts that intentionally do not
# read the file themselves (worker/deploy.sh, player-standalone/deploy.sh).
# Missing .env is ignored; CI can still inject process env.
dotenv: [".env"]

tasks:
  build:
    desc: Build the extension into dist with the development environment.
    cmds:
      - node esbuild.config.mjs --env development

  dist:
    desc: Build the extension into dist with the production environment.
    cmds:
      - node esbuild.config.mjs --env production

  watch:
    desc: Watch and rebuild extension sources.
    cmds:
      - node esbuild.config.mjs --watch

  typecheck:
    desc: Run root TypeScript checks.
    cmds:
      - npx tsc --noEmit

  lint:
    desc: Run Biome lint checks across supported source files.
    cmds:
      - npm run lint

  format:
    desc: Format Biome-supported repository sources.
    cmds:
      - npm run format

  format:check:
    desc: Check Biome-supported formatting and docs hygiene.
    cmds:
      - npm run format:check

  check:
    desc: Run Biome checks and docs hygiene validation across the repository.
    cmds:
      - npm run check

  test:
    desc: Run the root extension context tests once.
    cmds:
      - npm run test

  test:all:
    desc: Run tests across all contexts (root, player, worker); attempts every context and fails if any fail.
    cmds:
      - cmd: |
          failed=""
          npm run test || failed="$failed root"
          (cd player-standalone && npm run test) || failed="$failed player"
          (cd worker && npm run test) || failed="$failed worker"
          if [ -n "$failed" ]; then
            echo "Failed contexts:$failed" >&2
            exit 1
          fi
          echo "All contexts passed."

  player:sync:
    desc: Sync shared player assets into the standalone player.
    dir: player-standalone
    cmds:
      - node scripts/sync-player.js

  player:dev:
    desc: Run and watch the standalone player dev server.
    dir: player-standalone
    cmds:
      - npx concurrently -n sync,vite 'node scripts/sync-player.js --watch' 'npm exec -- vite --port 5176'

  player:build:
    desc: Sync and build the standalone player with the development environment.
    deps:
      - player:sync
    dir: player-standalone
    cmds:
      - npm exec -- tsc
      - npm exec -- vite build --mode development

  player:dist:
    desc: Sync and build the standalone player with the production environment.
    deps:
      - player:sync
    dir: player-standalone
    cmds:
      - npm exec -- tsc
      - npm exec -- vite build --mode production

  player:build:cloudflare:
    desc: Build the standalone player for Cloudflare Pages.
    env:
      VITE_BASE_PATH: '{{.VITE_BASE_PATH | default "/"}}'
    cmds:
      - task: player:dist

  player:preview:
    desc: Preview the built standalone player.
    dir: player-standalone
    cmds:
      - npm exec -- vite preview

  player:typecheck:
    desc: Run standalone player TypeScript checks.
    dir: player-standalone
    cmds:
      - npm exec -- tsc --noEmit

  player:deploy:
    desc: Deploy the standalone player to Cloudflare Pages.
    dir: player-standalone
    cmds:
      - ./deploy.sh

  worker:sync-dev-vars:
    desc: Sync worker/.dev.vars from root .env (Google/Dropbox secrets for local wrangler).
    cmds:
      - node scripts/sync-worker-dev-vars.mjs

  worker:dev:
    desc: Run the multi-issuer OAuth Worker locally (Google/Dropbox, hot reload, port 8787).
    deps:
      - worker:sync-dev-vars
    dir: worker
    cmds:
      - npm exec -- wrangler dev

  worker:typecheck:
    desc: Run OAuth Worker TypeScript checks.
    dir: worker
    cmds:
      - npm exec -- tsc --noEmit

  worker:deploy:
    desc: Deploy the multi-issuer OAuth Worker to Cloudflare (Google/Dropbox).
    dir: worker
    cmds:
      - ./deploy.sh

  build:all:
    desc: Build the extension and standalone player with development settings.
    cmds:
      - task: build
      - task: player:build

  dist:all:
    desc: Build the extension and standalone player with production settings.
    cmds:
      - task: dist
      - task: player:dist

  release:zip:
    desc: Zip the built extension for a GitHub release.
    cmds:
      - |
        release_name="gn-tracing-extension-${GITHUB_REF_NAME:-local}"
        trap 'rm -rf "$release_name"' EXIT
        rm -rf "$release_name" "$release_name.zip"
        cp -R dist "$release_name"
        zip -r "$release_name.zip" "$release_name"

  release:ci:
    desc: Run the CI release flow.
    cmds:
      - task: dist
      - task: release:zip

  store:check:
    desc: Validate the production extension package before Chrome Web Store upload.
    cmds:
      - npx tsc --noEmit
      - npm audit --omit=dev
      - task: player:typecheck
      - sh -c 'cd player-standalone && npm audit'
      - task: dist
      - node scripts/check-store-package.mjs

  store:zip:
    desc: Build, validate, and zip the Chrome Web Store package (manifest.key stripped).
    cmds:
      - task: store:check
      - node scripts/package-store-zip.mjs

  store:status:
    desc: Fetch the Chrome Web Store item status through the official API.
    cmds:
      - node scripts/chrome-webstore.mjs status

  store:cancel:
    desc: Cancel an in-review Chrome Web Store submission.
    cmds:
      - node scripts/chrome-webstore.mjs cancel

  store:upload:
    desc: Upload the Chrome Web Store zip through the official API.
    cmds:
      - node scripts/chrome-webstore.mjs upload --zip gn-tracing-store.zip

  store:publish:
    desc: Submit the uploaded Chrome Web Store item for review.
    cmds:
      - node scripts/chrome-webstore.mjs publish

  store:release:
    desc: Build, validate, upload, and submit the Chrome Web Store release.
    cmds:
      - task: store:zip
      - task: store:upload
      - task: store:publish

  dev:
    desc: >-
      Local full stack — extension watch (esbuild → localhost Worker proxies),
      standalone player (Vite + /api/drive|dropbox), multi-issuer OAuth
      Worker (wrangler :8787 Google/Dropbox).
    cmds:
      # Sync worker secrets before concurrent start so wrangler sees Dropbox.
      - task: worker:sync-dev-vars
      - npx concurrently -n ext,player,worker -c blue,green,magenta 'task watch' 'task player:dev' 'task worker:dev'
