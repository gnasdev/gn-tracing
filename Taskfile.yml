version: "3"

# Load root .env for deploy/build tasks so CHROME_EXTENSION_ID, Cloudflare
# tokens, and GOOGLE_* credentials reach scripts that intentionally do not
# read the file themselves (worker/deploy.sh).
# Missing .env is ignored; CI can still inject process env.
dotenv: [".env"]

tasks:
  build:
    desc: Build the Chrome extension into dist/chrome with the development environment.
    cmds:
      - node --experimental-strip-types esbuild.config.mjs --env development --browser chrome

  build:edge:
    desc: Build the Edge extension into dist/edge (development).
    cmds:
      - node --experimental-strip-types esbuild.config.mjs --env development --browser edge

  build:opera:
    desc: Build the Opera extension into dist/opera (development).
    cmds:
      - node --experimental-strip-types esbuild.config.mjs --env development --browser opera

  build:firefox:
    desc: Build the Firefox extension into dist/firefox (development).
    cmds:
      - node --experimental-strip-types esbuild.config.mjs --env development --browser firefox

  build:safari:
    desc: >-
      Build the macOS Safari extension into dist/safari (development). This is the
      plain JS/manifest bundle only; wrapping it into an Xcode project is a separate
      step (see docs on the Safari port plan) not yet automated here.
    cmds:
      - node --experimental-strip-types esbuild.config.mjs --env development --browser safari

  build:safari-ios:
    desc: >-
      Build the iOS/iPadOS Safari extension (reduced capture, no video) into
      dist/safari-ios (development). Same manifest as build:safari; only the Xcode
      App Extension wrapper differs, and that is not yet automated here.
    cmds:
      - node --experimental-strip-types esbuild.config.mjs --env development --browser safari-ios

  build:all:
    desc: Build Chrome, Edge, Opera, Firefox, and Safari (macOS + iOS) development packages.
    cmds:
      - task: build
      - task: build:edge
      - task: build:opera
      - task: build:firefox
      - task: build:safari
      - task: build:safari-ios

  dist:
    desc: Build the Chrome extension into dist/chrome with the production environment.
    cmds:
      - node --experimental-strip-types esbuild.config.mjs --env production --browser chrome

  dist:edge:
    desc: Build the Edge extension into dist/edge (production).
    cmds:
      - node --experimental-strip-types esbuild.config.mjs --env production --browser edge

  dist:opera:
    desc: Build the Opera extension into dist/opera (production).
    cmds:
      - node --experimental-strip-types esbuild.config.mjs --env production --browser opera

  dist:firefox:
    desc: Build the Firefox extension into dist/firefox (production).
    cmds:
      - node --experimental-strip-types esbuild.config.mjs --env production --browser firefox

  dist:safari:
    desc: Build the macOS Safari extension into dist/safari (production).
    cmds:
      - node --experimental-strip-types esbuild.config.mjs --env production --browser safari

  dist:safari-ios:
    desc: Build the iOS/iPadOS Safari extension into dist/safari-ios (production).
    cmds:
      - node --experimental-strip-types esbuild.config.mjs --env production --browser safari-ios

  dist:all:
    desc: Build Chrome, Edge, Opera, Firefox, and Safari (macOS + iOS) production packages.
    cmds:
      - task: dist
      - task: dist:edge
      - task: dist:opera
      - task: dist:firefox
      - task: dist:safari
      - task: dist:safari-ios

  watch:
    desc: >-
      Watch and rebuild extension sources for one browser target.
      BROWSER=chrome|edge|opera|firefox|safari (default chrome). CLI var or env BROWSER.
      safari also rebuilds "xcode/GN Tracing (macOS)" via xcodebuild on every
      save before notifying reload — meaningfully slower than the other
      targets (seconds, not instant); see build-xcode.mjs rebuild comment in
      esbuild.config.mjs. Requires the app already built+run once in Xcode
      with local signing configured (see DEVELOPER.md).
    vars:
      BROWSER: '{{.BROWSER | default (env "BROWSER") | default "chrome"}}'
    preconditions:
      - sh: 'case "{{.BROWSER}}" in chrome|edge|opera|firefox|safari) exit 0 ;; *) exit 1 ;; esac'
        msg: 'BROWSER must be chrome, edge, opera, firefox, or safari (got "{{.BROWSER}}").'
    cmds:
      - node --experimental-strip-types esbuild.config.mjs --watch --browser {{.BROWSER}}

  watch:chrome:
    desc: Watch and rebuild Chrome extension sources.
    cmds:
      - task: watch
        vars:
          BROWSER: chrome

  watch:edge:
    desc: Watch and rebuild Edge extension sources.
    cmds:
      - task: watch
        vars:
          BROWSER: edge

  watch:opera:
    desc: Watch and rebuild Opera extension sources.
    cmds:
      - task: watch
        vars:
          BROWSER: opera

  watch:firefox:
    desc: Watch and rebuild Firefox extension sources.
    cmds:
      - task: watch
        vars:
          BROWSER: firefox

  watch:safari:
    desc: >-
      Watch and rebuild the macOS Safari extension sources, rebuilding the
      Xcode wrapper via xcodebuild on every save (see task watch's desc).
    cmds:
      - task: watch
        vars:
          BROWSER: safari

  typecheck:
    desc: Run root TypeScript checks (production sources and test files).
    cmds:
      - npx tsc --noEmit
      - npx tsc --noEmit -p tsconfig.test.json

  lint:
    desc: Run Biome lint checks across supported source files.
    cmds:
      - npm run lint

  format:
    desc: Format Biome-supported repository sources.
    cmds:
      - npm run format

  format:check:
    desc: Check Biome-supported formatting and docs hygiene.
    cmds:
      - npm run format:check

  check:
    desc: Run Biome checks and docs hygiene validation across the repository.
    cmds:
      - npm run check

  test:
    desc: Run the root extension context tests once.
    cmds:
      - npm run test

  test:all:
    desc: Run tests across all contexts (root, player, worker); attempts every context and fails if any fail.
    cmds:
      - cmd: |
          failed=""
          npm run test || failed="$failed root"
          (cd player && npm run test) || failed="$failed player"
          (cd worker && npm run test) || failed="$failed worker"
          if [ -n "$failed" ]; then
            echo "Failed contexts:$failed" >&2
            exit 1
          fi
          echo "All contexts passed."

  test:e2e:
    desc: Run Playwright player e2e (requires browsers via npx playwright install chromium).
    cmds:
      - npm run test:e2e:player

  player:sync:
    desc: Sync root shared theme/icons into player/public.
    dir: player
    cmds:
      - node scripts/sync-player.js

  player:dev:
    desc: >-
      Run hosted player dev server (Vite + public/player.js runtime) on :5176.
      Reuses an instance already serving that port instead of failing to bind, so
      several `task dev` stacks (one per browser target) can coexist.
    dir: player
    cmds:
      - cmd: |
          if node ../scripts/port-listening.mjs 5176; then
            echo "[player:dev] http://localhost:5176 is already serving — reusing it."
            exit 0
          fi
          node scripts/sync-player.js
          exec npm exec -- vite --port 5176

  player:build:
    desc: Sync theme and build the hosted player (development mode).
    deps:
      - player:sync
    dir: player
    cmds:
      - npm exec -- tsc --noEmit -p tsconfig.json
      - npm exec -- vite build --mode development

  player:dist:
    desc: Sync theme and build the hosted player (production mode).
    deps:
      - player:sync
    dir: player
    cmds:
      - npm exec -- tsc --noEmit -p tsconfig.json
      - npm exec -- vite build --mode production

  player:build:release:
    desc: Build the standalone Player artifact for an immutable R2 release.
    env:
      VITE_BASE_PATH: '{{.VITE_BASE_PATH | default "/"}}'
      # Release scripts resolve and pass VITE_FEEDBACK_PROXY_URL so the Player
      # artifact keeps the deployed Worker origin without a Pages deploy wrapper.
    cmds:
      - task: player:dist

  player:preview:
    desc: Preview the built standalone player.
    dir: player
    cmds:
      - npm exec -- vite preview

  player:typecheck:
    desc: Run standalone player TypeScript checks.
    dir: player
    cmds:
      - npm exec -- tsc --noEmit

  worker:sync-dev-vars:
    desc: >-
      Sync worker/.dev.vars from root .env (OAuth secrets + optional
      GITHUB_FEEDBACK_TOKEN for local wrangler).
    cmds:
      - node scripts/sync-worker-dev-vars.mjs

  worker:dev:
    desc: >-
      Run the multi-issuer Worker locally (OAuth Google/Dropbox + POST /feedback,
      hot reload, port 63972). Also started by `task dev`. Reuses an instance
      already serving that port instead of failing to bind, so several `task dev`
      stacks (one per browser target) can coexist.
    deps:
      - worker:sync-dev-vars
    dir: worker
    cmds:
      - cmd: |
          if node ../scripts/worker-dev-health.mjs; then
            echo "[worker:dev] GN Tracing OAuth Worker is already serving http://localhost:63972 — reusing it."
            exit 0
          fi
          if node ../scripts/port-listening.mjs 63972; then
            echo "[worker:dev] Port 63972 is occupied by a service other than GN Tracing OAuth Worker. Stop that service, then rerun task worker:dev." >&2
            exit 1
          fi
          exec npm exec -- wrangler dev

  worker:typecheck:
    desc: Run OAuth Worker TypeScript checks.
    dir: worker
    cmds:
      - npm exec -- tsc --noEmit

  worker:deploy:
    desc: >-
      Manually deploy the multi-issuer OAuth Worker to Cloudflare.
      Not run by git hooks — invoke only when shipping edge.
    dir: worker
    cmds:
      - ./deploy.sh

  release:registry:check:
    desc: Validate the append-only immutable release registry.
    cmds:
      - node --experimental-strip-types scripts/validate-release-registry.mjs

  release:registry:typecheck:
    desc: Type-check immutable release registry sources.
    cmds:
      - npx tsc --noEmit -p packages/release-registry/tsconfig.json

  edge:player:typecheck:
    desc: Type-check the immutable Player release router.
    cmds:
      - npx tsc --noEmit -p edge/player-router/tsconfig.json

  edge:worker:typecheck:
    desc: Type-check the immutable Worker version dispatcher.
    cmds:
      - npx tsc --noEmit -p edge/worker-router/tsconfig.json

  edge:typecheck:
    desc: Type-check immutable release routers and their registry.
    cmds:
      - task: release:registry:typecheck
      - task: edge:player:typecheck
      - task: edge:worker:typecheck

  edge:player:bucket:create:
    desc: Create the immutable Player R2 bucket (explicit production action).
    cmds:
      - npx wrangler r2 bucket create gn-tracing-player-releases

  edge:player:deploy:
    desc: >-
      Deploy the Player version router without attaching the production custom domain.
      Requires LATEST_RELEASE_VERSION=<registered-version> to preserve legacy URLs explicitly.
    vars:
      LATEST_RELEASE_VERSION: '{{.LATEST_RELEASE_VERSION | default (env "LATEST_RELEASE_VERSION")}}'
    env:
      LATEST_RELEASE_VERSION: "{{.LATEST_RELEASE_VERSION}}"
    cmds:
      - node --experimental-strip-types scripts/generate-player-router-config.mjs --require-latest
      - npx wrangler deploy --config edge/player-router/wrangler.generated.toml

  edge:worker:deploy:
    desc: >-
      Deploy the Worker version dispatcher after generating Service Bindings. Requires
      LATEST_RELEASE_VERSION=<registered-version> to preserve legacy URLs explicitly.
    vars:
      LATEST_RELEASE_VERSION: '{{.LATEST_RELEASE_VERSION | default (env "LATEST_RELEASE_VERSION")}}'
    env:
      LATEST_RELEASE_VERSION: "{{.LATEST_RELEASE_VERSION}}"
    cmds:
      - node --experimental-strip-types scripts/generate-worker-router-config.mjs --require-latest
      - npx wrangler deploy --config edge/worker-router/wrangler.generated.toml

  player:router:config:
    desc: Generate Player router deployment configuration from the immutable release registry.
    cmds:
      - node --experimental-strip-types scripts/generate-player-router-config.mjs

  worker:router:config:
    desc: Generate Worker dispatcher Service Bindings from the immutable release registry.
    cmds:
      - node --experimental-strip-types scripts/generate-worker-router-config.mjs

  player:release:entry:
    desc: Build the current Player and print its immutable release registry candidate without writing it.
    cmds:
      - node --experimental-strip-types scripts/prepare-player-release-entry.mjs

  player:release:register:
    desc: Append the reviewed current Player release entry to the immutable registry.
    cmds:
      - node --experimental-strip-types scripts/prepare-player-release-entry.mjs --write

  player:release:prepare:
    desc: Build and validate the current immutable Player release without uploading it.
    cmds:
      - node --experimental-strip-types scripts/release-player-version.mjs

  player:release:upload:
    desc: Upload the current immutable Player release to R2 (explicit production action).
    cmds:
      - node --experimental-strip-types scripts/release-player-version.mjs --upload

  worker:release:prepare:
    desc: Validate the current immutable Worker release and generate its dispatcher bindings without deployment.
    cmds:
      - node --experimental-strip-types scripts/release-worker-version.mjs

  worker:release:deploy:
    desc: Deploy the current immutable Worker service (explicit production action).
    cmds:
      - node --experimental-strip-types scripts/release-worker-version.mjs --deploy

  core:typecheck:
    desc: Type-check the shared replay-core package.
    dir: packages/replay-core
    cmds:
      - npx tsc --noEmit

  sdk:typecheck:
    desc: Type-check the in-page browser SDK.
    dir: packages/sdk
    cmds:
      - npx tsc --noEmit

  mcp:build:
    desc: >-
      Bundle the local MCP server into mcp/dist/gn-tracing-mcp.mjs
      (required before pointing an MCP client at it).
    dir: mcp
    cmds:
      - npm exec -- node build.mjs

  mcp:typecheck:
    desc: Run MCP server TypeScript checks.
    dir: mcp
    cmds:
      - npm exec -- tsc --noEmit

  agent:sync:
    desc: >-
      Mirror the published plugin skills (plugins/*/skills) into the git-ignored
      .claude/skills and .agents/skills directories. Run after editing a skill.
    cmds:
      - node scripts/sync-agent-assets.mjs

  mcp:check:
    desc: >-
      Verify the publishable agent artifacts agree (npm package, server.json,
      plugin manifest) and that no plugin file is git-ignored.
    cmds:
      - node scripts/check-mcp-release.mjs

  mcp:pack:
    desc: >-
      Build and pack the npm tarball exactly as `npm publish` would, for
      inspecting the release before tagging.
    dir: mcp
    cmds:
      - npm exec -- node build.mjs
      - npm pack --dry-run

  typecheck:all:
    desc: Type-check every context, including immutable release routers and registry.
    cmds:
      - task: typecheck
      - task: core:typecheck
      - task: sdk:typecheck
      - task: mcp:typecheck
      - task: player:typecheck
      - task: worker:typecheck
      - task: edge:typecheck

  release:zip:
    desc: >-
      Zip dist/ (chrome/, edge/, opera/, firefox/, safari/, safari-ios/) for a
      GitHub release. Run task dist:all first so all browser packages are present.
      safari/safari-ios here are the plain JS/manifest bundles only, not a signed
      Xcode archive — Xcode packaging is a separate, not-yet-automated step.
    cmds:
      - |
        release_name="gn-tracing-extension-${GITHUB_REF_NAME:-local}"
        trap 'rm -rf "$release_name"' EXIT
        rm -rf "$release_name" "$release_name.zip"
        for browser in chrome edge opera firefox safari safari-ios; do
          if [ ! -d "dist/$browser" ]; then
            echo "Expected dist/$browser. Run task dist:all first." >&2
            exit 1
          fi
        done
        cp -R dist "$release_name"
        zip -r "$release_name.zip" "$release_name"

  release:ci:
    desc: >-
      Build production Chrome + Edge + Opera + Firefox + Safari (macOS + iOS)
      packages and zip them. Does not publish immutable Player or Worker
      artifacts; release services are published through the versioned R2/router
      release tasks. Safari packages here are unsigned JS bundles only.
    cmds:
      - npm run version:check
      - task: dist:all
      - task: release:zip

  store:check:
    desc: Validate the production Chrome package before Web Store upload.
    cmds:
      - npx tsc --noEmit
      - npm audit --omit=dev
      - task: player:typecheck
      - sh -c 'cd player && npm audit'
      - task: dist
      - node scripts/check-store-package.mjs --browser chrome

  store:check:edge:
    desc: Validate the production Edge package.
    cmds:
      - task: dist:edge
      - node scripts/check-store-package.mjs --browser edge

  store:check:opera:
    desc: Validate the production Opera package.
    cmds:
      - task: dist:opera
      - node scripts/check-store-package.mjs --browser opera

  store:check:firefox:
    desc: Validate the production Firefox package.
    cmds:
      - task: dist:firefox
      - node scripts/check-store-package.mjs --browser firefox

  store:check:safari:
    desc: Validate the production macOS Safari package (manifest/JS bundle shape only).
    cmds:
      - task: dist:safari
      - node scripts/check-store-package.mjs --browser safari

  store:check:safari-ios:
    desc: Validate the production iOS Safari package (manifest/JS bundle shape only).
    cmds:
      - task: dist:safari-ios
      - node scripts/check-store-package.mjs --browser safari-ios

  store:zip:
    desc: Build, validate, and zip the Chrome Web Store package (manifest.key stripped).
    cmds:
      - task: store:check
      - node scripts/package-store-zip.mjs --browser chrome

  store:zip:edge:
    desc: Build, validate, and zip the Edge Add-ons package.
    cmds:
      - task: store:check:edge
      - node scripts/package-store-zip.mjs --browser edge

  store:zip:opera:
    desc: Build, validate, and zip the Opera Add-ons package.
    cmds:
      - task: store:check:opera
      - node scripts/package-store-zip.mjs --browser opera

  store:zip:firefox:
    desc: Build, validate, and zip the Firefox AMO package.
    cmds:
      - task: store:check:firefox
      - node scripts/package-store-zip.mjs --browser firefox

  store:zip:safari:
    desc: >-
      Build, validate, and zip the macOS Safari package source (feeds
      safari-web-extension-converter / Xcode, not a direct store upload).
    cmds:
      - task: store:check:safari
      - node scripts/package-store-zip.mjs --browser safari

  store:zip:safari-ios:
    desc: >-
      Build, validate, and zip the iOS Safari package source (feeds Apple's
      Safari Web Extension Packager / Xcode, not a direct store upload).
    cmds:
      - task: store:check:safari-ios
      - node scripts/package-store-zip.mjs --browser safari-ios

  xcode:build:safari:
    desc: >-
      Build the macOS Safari app wrapper from "xcode/GN Tracing (macOS)"
      (unsigned local build — CODE_SIGNING_ALLOWED=NO). Checks dist/safari/
      isn't out of sync with the checked-in Xcode project before building.
    cmds:
      - task: dist:safari
      - node scripts/safari/build-xcode.mjs --scheme macos

  xcode:build:safari-ios:
    desc: >-
      Build the iOS Safari app wrapper from "xcode/GN Tracing (iOS)" for the
      Simulator (unsigned local build — CODE_SIGNING_ALLOWED=NO). Uses
      dist/safari-ios/, a separate project from macOS — see build-xcode.mjs
      header comment for why the two must never share one project.
    cmds:
      - task: dist:safari-ios
      - node scripts/safari/build-xcode.mjs --scheme ios --destination "generic/platform=iOS Simulator"

  xcode:notarize:safari:
    desc: >-
      Archive, Developer-ID sign, notarize, and staple the macOS Safari app
      for direct (non-App-Store) distribution. Requires real Apple Developer
      credentials (APPLE_TEAM_ID, APPLE_NOTARIZE_KEY_*) — see
      scripts/safari/sign-and-notarize.mjs header comment. Fails fast with a
      clear error when they are not set, before the slow archive step.
    cmds:
      - node scripts/safari/sign-and-notarize.mjs

  store:status:
    desc: Fetch the Chrome Web Store item status through the official API.
    cmds:
      - node scripts/chrome-webstore.mjs status

  store:cancel:
    desc: Cancel an in-review Chrome Web Store submission.
    cmds:
      - node scripts/chrome-webstore.mjs cancel

  store:upload:
    desc: Upload the Chrome Web Store zip through the official API.
    cmds:
      - node scripts/chrome-webstore.mjs upload --zip gn-tracing-store.zip

  store:publish:
    desc: Submit the uploaded Chrome Web Store item for review.
    cmds:
      - node scripts/chrome-webstore.mjs publish

  store:release:
    desc: Build, validate, upload, and submit the Chrome Web Store release.
    cmds:
      - task: store:zip
      - task: store:upload
      - task: store:publish

  # Shared browser matrix for local full-stack dev. Keep in sync with
  # esbuild.config.mjs normalizeBrowserTarget and test/task-dev-browsers.test.ts.
  # Targets: chrome | edge | opera | firefox | safari | all

  dev:
    desc: >-
      Local full stack — extension watch and development-only extension reload for
      Chrome + Firefox + macOS Safari by default, standalone player (Vite :5176), and
      multi-issuer Worker (wrangler :63972). BROWSER=chrome|edge|opera|firefox|safari runs one
      target; BROWSER=both is the default; BROWSER=all / `task dev:all` runs every
      target including Safari. Safari requires the macOS app already built+run once
      in Xcode with local signing configured, and its reload loop is meaningfully
      slower than the others (xcodebuild runs on every save — see task watch's desc).
    vars:
      BROWSER: '{{.BROWSER | default (env "BROWSER") | default "both"}}'
      DEV_EXTENSION_RELOAD_PORT: '{{.DEV_EXTENSION_RELOAD_PORT | default (env "DEV_EXTENSION_RELOAD_PORT") | default "63973"}}'
    preconditions:
      - sh: 'case "{{.BROWSER}}" in chrome|edge|opera|firefox|safari|both|all) exit 0 ;; *) exit 1 ;; esac'
        msg: 'BROWSER must be chrome, edge, opera, firefox, safari, both, or all (got "{{.BROWSER}}").'
    cmds:
      # Sync worker secrets before concurrent start so wrangler sees OAuth + feedback vars.
      - task: worker:sync-dev-vars
      # A single concurrently supervisor owns every long-running dev process.
      # Keeping the reload coordinator inside the group prevents a dead child from
      # leaving task dev alive with only a background coordinator.
      - cmd: |
          set -eu
          browser="{{.BROWSER}}"
          reload_port="{{.DEV_EXTENSION_RELOAD_PORT}}"
          export DEV_EXTENSION_RELOAD_PORT="$reload_port"
          if [ "$browser" = "all" ]; then
            npx concurrently --kill-others-on-fail --kill-signal SIGKILL \
              -n reload,ext:chrome,ext:edge,ext:opera,ext:firefox,ext:safari,player,worker \
              -c white,blue,cyan,yellow,red,gray,green,magenta \
              "node scripts/dev-extension-reload.mjs --port $reload_port" \
              'task watch BROWSER=chrome' \
              'task watch BROWSER=edge' \
              'task watch BROWSER=opera' \
              'task watch BROWSER=firefox' \
              'task watch BROWSER=safari' \
              'task player:dev' \
              'task worker:dev'
            exit "$?"
          fi
          if [ "$browser" = "both" ]; then
            npx concurrently --kill-others-on-fail --kill-signal SIGKILL \
              -n reload,ext:chrome,ext:firefox,ext:safari,player,worker \
              -c white,blue,red,gray,green,magenta \
              "node scripts/dev-extension-reload.mjs --port $reload_port" \
              'task watch BROWSER=chrome' \
              'task watch BROWSER=firefox' \
              'task watch BROWSER=safari' \
              'task player:dev' \
              'task worker:dev'
            exit "$?"
          fi
          npx concurrently --kill-others-on-fail --kill-signal SIGKILL \
            -n "reload,ext:${browser},player,worker" \
            -c white,blue,green,magenta \
            "node scripts/dev-extension-reload.mjs --port $reload_port" \
            "task watch BROWSER=${browser}" \
            'task player:dev' \
            'task worker:dev'

  dev:chrome:
    desc: Local full stack watching the Chrome extension build.
    cmds:
      - task: dev
        vars:
          BROWSER: chrome

  dev:edge:
    desc: Local full stack watching the Edge extension build.
    cmds:
      - task: dev
        vars:
          BROWSER: edge

  dev:opera:
    desc: Local full stack watching the Opera extension build.
    cmds:
      - task: dev
        vars:
          BROWSER: opera

  dev:firefox:
    desc: Local full stack watching the Firefox extension build.
    cmds:
      - task: dev
        vars:
          BROWSER: firefox

  dev:safari:
    desc: >-
      Local full stack watching the macOS Safari extension build. Requires the
      app already built+run once in Xcode with local signing configured (see
      DEVELOPER.md); reload is meaningfully slower than other targets since
      xcodebuild runs on every save.
    cmds:
      - task: dev
        vars:
          BROWSER: safari

  dev:all:
    desc: >-
      Local full stack watching Chrome, Edge, Opera, Firefox, and macOS Safari
      builds together, plus the player, local Worker, and shared reload
      coordinator. Eight foreground long-running processes — heavier than
      single-target `task dev`; use when a change must be verified on every
      target. Alias for `task dev BROWSER=all`. Safari requires the app
      already built+run once in Xcode with local signing configured.
    cmds:
      - task: dev
        vars:
          BROWSER: all
