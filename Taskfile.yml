version: "3"

tasks:
  build:
    desc: Build the extension into dist with the development environment.
    cmds:
      - node esbuild.config.mjs --env development

  dist:
    desc: Build the extension into dist with the production environment.
    cmds:
      - node esbuild.config.mjs --env production

  watch:
    desc: Watch and rebuild extension sources.
    cmds:
      - node esbuild.config.mjs --watch

  typecheck:
    desc: Run root TypeScript checks.
    cmds:
      - npx tsc --noEmit

  lint:
    desc: Run Biome lint checks across the repository.
    cmds:
      - npm run lint

  format:
    desc: Format repository sources with Biome.
    cmds:
      - npm run format

  format:check:
    desc: Check repository formatting with Biome.
    cmds:
      - npm run format:check

  check:
    desc: Run Biome format, lint, and import checks across the repository.
    cmds:
      - npm run check

  player:sync:
    desc: Sync shared player assets into the standalone player.
    dir: player-standalone
    cmds:
      - node scripts/sync-player.js

  player:dev:
    desc: Run and watch the standalone player dev server.
    dir: player-standalone
    cmds:
      - npm exec -- vite --port 5173

  player:build:
    desc: Sync and build the standalone player with the development environment.
    deps:
      - player:sync
    dir: player-standalone
    cmds:
      - npm exec -- tsc
      - npm exec -- vite build --mode development

  player:dist:
    desc: Sync and build the standalone player with the production environment.
    deps:
      - player:sync
    dir: player-standalone
    cmds:
      - npm exec -- tsc
      - npm exec -- vite build --mode production

  player:build:cloudflare:
    desc: Build the standalone player for Cloudflare Pages.
    env:
      VITE_BASE_PATH: '{{.VITE_BASE_PATH | default "/"}}'
    cmds:
      - task: player:dist

  player:preview:
    desc: Preview the built standalone player.
    dir: player-standalone
    cmds:
      - npm exec -- vite preview

  player:typecheck:
    desc: Run standalone player TypeScript checks.
    dir: player-standalone
    cmds:
      - npm exec -- tsc --noEmit

  player:deploy:
    desc: Deploy the standalone player to Cloudflare Pages.
    dir: player-standalone
    cmds:
      - ./deploy.sh

  build:all:
    desc: Build the extension and standalone player with development settings.
    cmds:
      - task: build
      - task: player:build

  dist:all:
    desc: Build the extension and standalone player with production settings.
    cmds:
      - task: dist
      - task: player:dist

  release:zip:
    desc: Zip the built extension for a GitHub release.
    cmds:
      - |
        release_name="gn-tracing-extension-${GITHUB_REF_NAME:-local}"
        trap 'rm -rf "$release_name"' EXIT
        rm -rf "$release_name" "$release_name.zip"
        cp -R dist "$release_name"
        zip -r "$release_name.zip" "$release_name"

  release:ci:
    desc: Run the CI release flow.
    cmds:
      - task: dist
      - task: release:zip

  store:check:
    desc: Validate the production extension package before Chrome Web Store upload.
    cmds:
      - npx tsc --noEmit
      - npm audit --omit=dev
      - task: player:typecheck
      - sh -c 'cd player-standalone && npm audit'
      - task: dist
      - node scripts/check-store-package.mjs

  store:zip:
    desc: Build, validate, and zip the Chrome Web Store package.
    cmds:
      - task: store:check
      - sh -c 'rm -f gn-tracing-store.zip && cd dist && zip -r ../gn-tracing-store.zip .'

  store:status:
    desc: Fetch the Chrome Web Store item status through the official API.
    cmds:
      - node scripts/chrome-webstore.mjs status

  store:upload:
    desc: Upload the Chrome Web Store zip through the official API.
    cmds:
      - node scripts/chrome-webstore.mjs upload --zip gn-tracing-store.zip

  store:publish:
    desc: Submit the uploaded Chrome Web Store item for review.
    cmds:
      - node scripts/chrome-webstore.mjs publish

  store:release:
    desc: Build, validate, upload, and submit the Chrome Web Store release.
    cmds:
      - task: store:zip
      - task: store:upload
      - task: store:publish

  watch:all:
    desc: Watch extension sources and run the standalone player dev server.
    cmds:
      - npx concurrently 'task watch' 'task player:dev'
