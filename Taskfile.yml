version: "3"

# Load root .env for deploy/build tasks so CHROME_EXTENSION_ID, Cloudflare
# tokens, and GOOGLE_* credentials reach scripts that intentionally do not
# read the file themselves (worker/deploy.sh, player/deploy.sh).
# Missing .env is ignored; CI can still inject process env.
dotenv: [".env"]

tasks:
  build:
    desc: Build the Chrome extension into dist/chrome with the development environment.
    cmds:
      - node --experimental-strip-types esbuild.config.mjs --env development --browser chrome

  build:edge:
    desc: Build the Edge extension into dist/edge (development).
    cmds:
      - node --experimental-strip-types esbuild.config.mjs --env development --browser edge

  build:firefox:
    desc: Build the Firefox extension into dist/firefox (development).
    cmds:
      - node --experimental-strip-types esbuild.config.mjs --env development --browser firefox

  build:all:
    desc: Build Chrome, Edge, and Firefox development packages.
    cmds:
      - task: build
      - task: build:edge
      - task: build:firefox

  dist:
    desc: Build the Chrome extension into dist/chrome with the production environment.
    cmds:
      - node --experimental-strip-types esbuild.config.mjs --env production --browser chrome

  dist:edge:
    desc: Build the Edge extension into dist/edge (production).
    cmds:
      - node --experimental-strip-types esbuild.config.mjs --env production --browser edge

  dist:firefox:
    desc: Build the Firefox extension into dist/firefox (production).
    cmds:
      - node --experimental-strip-types esbuild.config.mjs --env production --browser firefox

  dist:all:
    desc: Build Chrome, Edge, and Firefox production packages.
    cmds:
      - task: dist
      - task: dist:edge
      - task: dist:firefox

  watch:
    desc: Watch and rebuild Chrome extension sources.
    cmds:
      - node --experimental-strip-types esbuild.config.mjs --watch --browser chrome

  watch:edge:
    desc: Watch and rebuild Edge extension sources.
    cmds:
      - node --experimental-strip-types esbuild.config.mjs --watch --browser edge

  watch:firefox:
    desc: Watch and rebuild Firefox extension sources.
    cmds:
      - node --experimental-strip-types esbuild.config.mjs --watch --browser firefox

  typecheck:
    desc: Run root TypeScript checks (production sources and test files).
    cmds:
      - npx tsc --noEmit
      - npx tsc --noEmit -p tsconfig.test.json

  lint:
    desc: Run Biome lint checks across supported source files.
    cmds:
      - npm run lint

  format:
    desc: Format Biome-supported repository sources.
    cmds:
      - npm run format

  format:check:
    desc: Check Biome-supported formatting and docs hygiene.
    cmds:
      - npm run format:check

  check:
    desc: Run Biome checks and docs hygiene validation across the repository.
    cmds:
      - npm run check

  test:
    desc: Run the root extension context tests once.
    cmds:
      - npm run test

  test:all:
    desc: Run tests across all contexts (root, player, worker); attempts every context and fails if any fail.
    cmds:
      - cmd: |
          failed=""
          npm run test || failed="$failed root"
          (cd player && npm run test) || failed="$failed player"
          (cd worker && npm run test) || failed="$failed worker"
          if [ -n "$failed" ]; then
            echo "Failed contexts:$failed" >&2
            exit 1
          fi
          echo "All contexts passed."

  test:e2e:
    desc: Run Playwright player e2e (requires browsers via npx playwright install chromium).
    cmds:
      - npm run test:e2e:player

  player:sync:
    desc: Sync root shared theme/icons into player/public.
    dir: player
    cmds:
      - node scripts/sync-player.js

  player:dev:
    desc: Run hosted player dev server (Vite + public/player.js runtime).
    dir: player
    cmds:
      - node scripts/sync-player.js
      - npm exec -- vite --port 5176

  player:build:
    desc: Sync theme and build the hosted player (development mode).
    deps:
      - player:sync
    dir: player
    cmds:
      - npm exec -- tsc --noEmit -p tsconfig.json
      - npm exec -- vite build --mode development

  player:dist:
    desc: Sync theme and build the hosted player (production mode).
    deps:
      - player:sync
    dir: player
    cmds:
      - npm exec -- tsc --noEmit -p tsconfig.json
      - npm exec -- vite build --mode production

  player:build:cloudflare:
    desc: Build the standalone player for Cloudflare Pages.
    env:
      VITE_BASE_PATH: '{{.VITE_BASE_PATH | default "/"}}'
      # VITE_FEEDBACK_PROXY_URL is intentionally NOT forced here — deploy.sh
      # resolves and exports it so nested vite builds inherit the real Worker URL.
      # Blanking it in this map would ship feedback as "not configured" in prod.
    cmds:
      - task: player:dist

  player:preview:
    desc: Preview the built standalone player.
    dir: player
    cmds:
      - npm exec -- vite preview

  player:typecheck:
    desc: Run standalone player TypeScript checks.
    dir: player
    cmds:
      - npm exec -- tsc --noEmit

  player:deploy:
    desc: >-
      Manually deploy the standalone player to Cloudflare Pages.
      Not run by git hooks — invoke only when shipping edge.
    dir: player
    cmds:
      - ./deploy.sh

  worker:sync-dev-vars:
    desc: >-
      Sync worker/.dev.vars from root .env (OAuth secrets + optional
      GITHUB_FEEDBACK_TOKEN for local wrangler).
    cmds:
      - node scripts/sync-worker-dev-vars.mjs

  worker:dev:
    desc: >-
      Run the multi-issuer Worker locally (OAuth Google/Dropbox + POST /feedback,
      hot reload, port 8787). Also started by `task dev`.
    deps:
      - worker:sync-dev-vars
    dir: worker
    cmds:
      - npm exec -- wrangler dev

  worker:typecheck:
    desc: Run OAuth Worker TypeScript checks.
    dir: worker
    cmds:
      - npm exec -- tsc --noEmit

  worker:deploy:
    desc: >-
      Manually deploy the multi-issuer OAuth Worker to Cloudflare.
      Not run by git hooks — invoke only when shipping edge.
    dir: worker
    cmds:
      - ./deploy.sh

  core:typecheck:
    desc: Type-check the shared replay-core package.
    dir: packages/replay-core
    cmds:
      - npx tsc --noEmit

  sdk:typecheck:
    desc: Type-check the in-page browser SDK.
    dir: packages/sdk
    cmds:
      - npx tsc --noEmit

  mcp:build:
    desc: >-
      Bundle the local MCP server into mcp/dist/gn-tracing-mcp.mjs
      (required before pointing an MCP client at it).
    dir: mcp
    cmds:
      - npm exec -- node build.mjs

  mcp:typecheck:
    desc: Run MCP server TypeScript checks.
    dir: mcp
    cmds:
      - npm exec -- tsc --noEmit

  agent:sync:
    desc: >-
      Mirror the published plugin skills (plugins/*/skills) into the git-ignored
      .claude/skills and .agents/skills directories. Run after editing a skill.
    cmds:
      - node scripts/sync-agent-assets.mjs

  mcp:check:
    desc: >-
      Verify the publishable agent artifacts agree (npm package, server.json,
      plugin manifest) and that no plugin file is git-ignored.
    cmds:
      - node scripts/check-mcp-release.mjs

  mcp:pack:
    desc: >-
      Build and pack the npm tarball exactly as `npm publish` would, for
      inspecting the release before tagging.
    dir: mcp
    cmds:
      - npm exec -- node build.mjs
      - npm pack --dry-run

  typecheck:all:
    desc: Type-check every context (root, replay-core, SDK, MCP, player, worker).
    cmds:
      - task: typecheck
      - task: core:typecheck
      - task: sdk:typecheck
      - task: mcp:typecheck
      - task: player:typecheck
      - task: worker:typecheck

  release:zip:
    desc: >-
      Zip dist/ (chrome/, edge/, firefox/) for a GitHub release.
      Run task dist:all first so all browser packages are present.
    cmds:
      - |
        release_name="gn-tracing-extension-${GITHUB_REF_NAME:-local}"
        trap 'rm -rf "$release_name"' EXIT
        rm -rf "$release_name" "$release_name.zip"
        if [ ! -d dist/chrome ] || [ ! -d dist/edge ] || [ ! -d dist/firefox ]; then
          echo "Expected dist/chrome, dist/edge, and dist/firefox. Run task dist:all first." >&2
          exit 1
        fi
        cp -R dist "$release_name"
        zip -r "$release_name.zip" "$release_name"

  release:ci:
    desc: >-
      Build production Chrome + Edge + Firefox packages and zip them.
      Does not deploy Worker/Player — run task worker:deploy / player:deploy
      manually before shipping if edge changed.
    cmds:
      - npm run version:check
      - task: dist:all
      - task: release:zip

  store:check:
    desc: Validate the production Chrome package before Web Store upload.
    cmds:
      - npx tsc --noEmit
      - npm audit --omit=dev
      - task: player:typecheck
      - sh -c 'cd player && npm audit'
      - task: dist
      - node scripts/check-store-package.mjs --browser chrome

  store:check:edge:
    desc: Validate the production Edge package.
    cmds:
      - task: dist:edge
      - node scripts/check-store-package.mjs --browser edge

  store:check:firefox:
    desc: Validate the production Firefox package.
    cmds:
      - task: dist:firefox
      - node scripts/check-store-package.mjs --browser firefox

  store:zip:
    desc: Build, validate, and zip the Chrome Web Store package (manifest.key stripped).
    cmds:
      - task: store:check
      - node scripts/package-store-zip.mjs --browser chrome

  store:zip:edge:
    desc: Build, validate, and zip the Edge Add-ons package.
    cmds:
      - task: store:check:edge
      - node scripts/package-store-zip.mjs --browser edge

  store:zip:firefox:
    desc: Build, validate, and zip the Firefox AMO package.
    cmds:
      - task: store:check:firefox
      - node scripts/package-store-zip.mjs --browser firefox

  store:status:
    desc: Fetch the Chrome Web Store item status through the official API.
    cmds:
      - node scripts/chrome-webstore.mjs status

  store:cancel:
    desc: Cancel an in-review Chrome Web Store submission.
    cmds:
      - node scripts/chrome-webstore.mjs cancel

  store:upload:
    desc: Upload the Chrome Web Store zip through the official API.
    cmds:
      - node scripts/chrome-webstore.mjs upload --zip gn-tracing-store.zip

  store:publish:
    desc: Submit the uploaded Chrome Web Store item for review.
    cmds:
      - node scripts/chrome-webstore.mjs publish

  store:release:
    desc: Build, validate, upload, and submit the Chrome Web Store release.
    cmds:
      - task: store:zip
      - task: store:upload
      - task: store:publish

  dev:
    desc: >-
      Local full stack — extension watch (esbuild → localhost Worker proxies),
      standalone player (Vite + /api/drive|dropbox), multi-issuer Worker
      (wrangler :8787 OAuth Google/Dropbox + POST /feedback).
    cmds:
      # Sync worker secrets before concurrent start so wrangler sees OAuth + feedback vars.
      - task: worker:sync-dev-vars
      # Three long-running processes: extension rebuild, player, local Worker on :8787.
      - npx concurrently -n ext,player,worker -c blue,green,magenta 'task watch' 'task player:dev' 'task worker:dev'
