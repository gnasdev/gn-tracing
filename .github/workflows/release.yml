# Publishes a GitHub release for the GN Tracing extension when a tag shaped
# `v<version>` is pushed. The produced zip can be installed as an unpacked
# extension or used as the basis for a Chrome Web Store upload (`task store:zip`
# and `task store:release` are separate manual steps for the Web Store).
#
# Trigger: git tag v1.2.3 && git push origin v1.2.3
name: Release extension

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the GitHub release and upload assets

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify required secrets
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_TOKEN_PROXY_URL: ${{ secrets.GOOGLE_TOKEN_PROXY_URL }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_EXTENSION_PUBLIC_KEY: ${{ secrets.CHROME_EXTENSION_PUBLIC_KEY }}
          CHROME_EXTENSION_PRIVATE_KEY: ${{ secrets.CHROME_EXTENSION_PRIVATE_KEY }}
        run: |
          for secret in GOOGLE_CLIENT_ID GOOGLE_TOKEN_PROXY_URL CHROME_EXTENSION_ID CHROME_EXTENSION_PUBLIC_KEY CHROME_EXTENSION_PRIVATE_KEY; do
            if [ -z "${!secret}" ]; then
              echo "::error::Missing required secret: $secret"
              exit 1
            fi
          done

      - name: Build production extension zip
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_TOKEN_PROXY_URL: ${{ secrets.GOOGLE_TOKEN_PROXY_URL }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_EXTENSION_PUBLIC_KEY: ${{ secrets.CHROME_EXTENSION_PUBLIC_KEY }}
          CHROME_EXTENSION_PRIVATE_KEY: ${{ secrets.CHROME_EXTENSION_PRIVATE_KEY }}
        run: task release:ci

      - name: Upload release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_zip="gn-tracing-extension-${{ github.ref_name }}.zip"
          if [ ! -f "$release_zip" ]; then
            echo "Expected release zip not found: $release_zip" >&2
            exit 1
          fi
          gh release create "${{ github.ref_name }}" \
            --title "GN Tracing ${{ github.ref_name }}" \
            --generate-notes \
            --notes "Download \`$release_zip\` from the assets below and load the extracted extension folder in Chrome or Edge developer mode.

          GitHub may still show automatically generated Source code links for the release tag. Those archives are not the installable extension package." \
            "$release_zip"
