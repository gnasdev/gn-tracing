<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Annotate screenshot — GN Tracing</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="../icons/phosphor-icons.css">
  <link rel="stylesheet" href="annotate.css">
  <script src="../shared/theme-init.js"></script>
</head>
<body>
  <div id="app">
    <header class="editor-topbar">
      <div class="editor-title">
        <img src="../icons/icon32.png" alt="" width="20" height="20">
        <span data-i18n="annotate.title">Annotate screenshot</span>
      </div>

      <div class="editor-tools" role="toolbar" aria-label="Annotation tools">
        <button type="button" class="tool-btn is-active" data-tool="select" title="Select (V)" aria-pressed="true">
          <i class="ph ph-cursor" aria-hidden="true"></i>
        </button>
        <button type="button" class="tool-btn" data-tool="arrow" title="Arrow (A)" aria-pressed="false">
          <i class="ph ph-arrow-up-right" aria-hidden="true"></i>
        </button>
        <button type="button" class="tool-btn" data-tool="rect" title="Box (R)" aria-pressed="false">
          <i class="ph ph-rectangle" aria-hidden="true"></i>
        </button>
        <button type="button" class="tool-btn" data-tool="ellipse" title="Circle (O)" aria-pressed="false">
          <i class="ph ph-circle" aria-hidden="true"></i>
        </button>
        <button type="button" class="tool-btn" data-tool="freehand" title="Pen (P)" aria-pressed="false">
          <i class="ph ph-scribble" aria-hidden="true"></i>
        </button>
        <button type="button" class="tool-btn" data-tool="text" title="Note (T)" aria-pressed="false">
          <i class="ph ph-text-t" aria-hidden="true"></i>
        </button>
        <button type="button" class="tool-btn" data-tool="highlight" title="Highlight (H)" aria-pressed="false">
          <i class="ph ph-highlighter-circle" aria-hidden="true"></i>
        </button>
        <button type="button" class="tool-btn tool-btn-redact" data-tool="redact" title="Redact — destroys these pixels (X)" aria-pressed="false">
          <i class="ph ph-selection-background" aria-hidden="true"></i>
        </button>

        <span class="tool-divider" aria-hidden="true"></span>

        <input id="color-input" type="color" value="#ff3b30" aria-label="Annotation colour" title="Annotation colour">

        <span class="tool-divider" aria-hidden="true"></span>

        <button type="button" class="tool-btn" id="undo-btn" title="Undo (⌘Z)" disabled>
          <i class="ph ph-arrow-u-up-left" aria-hidden="true"></i>
        </button>
        <button type="button" class="tool-btn" id="redo-btn" title="Redo (⇧⌘Z)" disabled>
          <i class="ph ph-arrow-u-up-right" aria-hidden="true"></i>
        </button>
        <button type="button" class="tool-btn" id="delete-btn" title="Delete selected (⌫)" disabled>
          <i class="ph ph-trash" aria-hidden="true"></i>
        </button>
      </div>

      <div class="editor-actions">
        <button type="button" id="discard-btn" class="btn btn-secondary" data-i18n="annotate.discard">Discard</button>
        <button type="button" id="save-btn" class="btn btn-primary" data-i18n="annotate.save">Save &amp; upload</button>
      </div>
    </header>

    <main class="editor-main">
      <div id="stage" class="editor-stage">
        <div id="canvas-wrap" class="canvas-wrap">
          <img id="screenshot-img" alt="Captured screenshot">
          <!-- A drawing surface, not a picture. The accessible representation
               of what has been drawn is the text list in the sidebar, which is
               kept in sync with these shapes. -->
          <svg id="overlay" class="overlay" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" role="application" aria-label="Annotation drawing surface">
            <title>Annotation drawing surface</title>
          </svg>
        </div>
      </div>

      <aside class="editor-sidebar">
        <label class="field">
          <span class="field-label" data-i18n="annotate.caption">What is wrong here?</span>
          <textarea id="caption-input" rows="3" placeholder="The total shows $0 after applying a coupon"></textarea>
        </label>

        <div class="redaction-note" id="redaction-note" hidden>
          <strong data-i18n="annotate.redactTitle">Redaction destroys pixels</strong>
          <p data-i18n="annotate.redactBody">Redacted regions are permanently pixelated in the saved image before it is uploaded. They cannot be recovered from the package, and the player never receives the original pixels.</p>
        </div>

        <div class="shape-list-wrap">
          <span class="field-label" data-i18n="annotate.shapes">Annotations</span>
          <ul id="shape-list" class="shape-list"></ul>
        </div>

        <p id="status" class="editor-status" role="status" aria-live="polite"></p>
      </aside>
    </main>
  </div>

  <script src="annotate.js"></script>
</body>
</html>
