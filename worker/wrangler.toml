#:schema node_modules/wrangler/config-schema.json
#
# Multi-issuer OAuth token proxy for GN Tracing (Google / Dropbox).
# Secrets: wrangler secret put GOOGLE_CLIENT_SECRET | DROPBOX_CLIENT_SECRET
# Deploy: task worker:deploy  (or ./deploy.sh)

name = "gn-tracing-oauth-proxy"
main = "src/index.ts"
compatibility_date = "2024-11-01"
workers_dev = true

[dev]
ip = "localhost"
port = 63972
local_protocol = "http"

# Public vars. Secrets are set via `wrangler secret put` (or .dev.vars locally).
# Secrets: GOOGLE_CLIENT_SECRET, DROPBOX_CLIENT_SECRET, GITHUB_FEEDBACK_TOKEN
[vars]
GOOGLE_CLIENT_ID = ""
DROPBOX_CLIENT_ID = ""
ALLOWED_EXTENSION_ORIGINS = ""
# When "true", empty ALLOWED_EXTENSION_ORIGINS is a misconfiguration (fail closed).
STRICT_ORIGIN = ""
GITHUB_REPO_OWNER = "gnasdev"
GITHUB_REPO_NAME = "gn-tracing"
GITHUB_FEEDBACK_LABELS = "feedback"
# Remote MCP endpoint (POST /mcp) for coding agents. Set to "false" to disable.
MCP_ENABLED = "true"
# Player origin whose /api/drive and /api/dropbox proxies stream package bytes.
PLAYER_ORIGIN = "https://tracing.gnas.dev"
