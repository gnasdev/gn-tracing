#:schema node_modules/wrangler/config-schema.json
#
# Multi-issuer OAuth token proxy for GN Tracing (Google / Dropbox).
# Secrets: wrangler secret put GOOGLE_CLIENT_SECRET | DROPBOX_CLIENT_SECRET
# Deploy: task worker:deploy  (or ./deploy.sh)

name = "gn-tracing-oauth-proxy"
main = "src/index.ts"
compatibility_date = "2024-11-01"
workers_dev = true

[dev]
ip = "localhost"
port = 8787
local_protocol = "http"

# Public vars. Secrets are set via `wrangler secret put` (or .dev.vars locally).
[vars]
GOOGLE_CLIENT_ID = ""
DROPBOX_CLIENT_ID = ""
ALLOWED_EXTENSION_ORIGINS = ""
